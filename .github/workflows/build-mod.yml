name: build-mod
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Apply mod files
      run: unzip -o mod.zip
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - run: pip install -r requirements.txt
    - run: |
        ./build.sh setup
        ./build.sh pack -p android -v 1 --no-zip
        cd build/pack-android && zip -r ../Newb-Aurora-Storm.mcpack .
    - uses: actions/upload-artifact@v4
      with:
        name: Newb-Aurora-Storm
        path: ./build/Newb-Aurora-Storm.mcpack
